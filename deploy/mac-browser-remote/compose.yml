name: mac-browser-remote

services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 remote.py init first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U guacamole -d guacamole"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]

  guacd:
    image: mac-browser-remote-guacd:1.6.0-vnc1
    build:
      context: ./guacd
    restart: unless-stopped
    networks: [desktop]

  guacamole:
    image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_USERNAME: guacamole
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 remote.py init first}
      TOTP_ENABLED: "true"
      TOTP_ISSUER: Mac Remote
      API_SESSION_TIMEOUT: "15"
      BAN_ENABLED: "true"
    networks: [database, desktop, web]

networks:
  database:
    internal: true
  desktop: {}
  web: {}

volumes:
  postgres_data:

